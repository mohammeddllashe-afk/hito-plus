name: CI - Build, Push & Migrate

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image (Docker Hub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image (local, for scan)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hito-plus-backend:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/hito-plus-backend:${{ github.sha }}
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false

      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hito-plus-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hito-plus-backend:latest

  migrate:
    name: Run database migrations (temporary job)
    runs-on: ubuntu-latest
    needs: build-and-push
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hito_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Postgres not ready yet, sleeping..."
            sleep 2
          done
        env:
          PGPASSWORD: postgres

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hito_dev
          NODE_ENV: development
        run: npx knex migrate:latest --knexfile ./knexfile.js

      - name: Run seed (demo) optionally
        if: always()
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hito_dev
        run: npx knex seed:run --knexfile ./knexfile.js || true
