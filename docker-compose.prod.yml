version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hito_prod
    volumes:
      - db_prod_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/hito_prod"
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_prod_data:
