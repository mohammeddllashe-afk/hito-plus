<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Sweet Tic Tac | Kitchen</title>

<style>
:root{
  --bg:#0b0d10;
  --panel:#11151a;
  --card:#171c22;
  --line:#2a313a;
  --text:#f7f8fa;
  --muted:#98a2b3;
  --green:#2bd576;
  --yellow:#f6b73c;
  --red:#ff4d4f;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:radial-gradient(circle at top right,#17202a 0,#0b0d10 38%,#080a0c 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  height:78px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(11,13,16,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#ff5a5f,#ff8b5c);
  display:grid;
  place-items:center;
  font-weight:900;
}

h1{
  font-size:28px;
  margin:0;
}

.sub{
  font-size:13px;
  color:var(--muted);
}

.clock{
  font-size:20px;
  font-weight:800;
}

main{
  max-width:1600px;
  margin:auto;
  padding:22px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  color:#d6dbe3;
}

.stat strong{
  color:#fff;
  font-size:18px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  font-weight:800;
  border-radius:10px;
}

.add{
  background:#fff;
  color:#111;
  padding:12px 17px;
}

.syncTools{
  display:flex;
  gap:9px;
  align-items:center;
}

.notify{
  background:#2a313a;
  color:#fff;
  padding:12px 14px;
}

.clearDone{
  background:var(--red);
  color:#fff;
  padding:12px 14px;
}

button:disabled{
  cursor:not-allowed;
  opacity:.45;
}

.syncStatus{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(180deg,#1a2027,#151a20);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.32);
  cursor:pointer;
}

.card.new{
  border-color:#4b5664;
}

.card.done{
  opacity:.62;
}

.cardTop{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.num{
  font-size:14px;
  font-weight:900;
  color:var(--muted);
  margin-top:3px;
}

.timer{
  font-size:30px;
  line-height:1;
  font-weight:900;
  letter-spacing:0;
}

.status{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
}

.s-new{
  background:#3c2430;
  color:#ffb2c0;
}

.s-work{
  background:#3d321a;
  color:#ffd677;
}

.s-done{
  background:#173827;
  color:#84eab0;
}

.timer.late{
  color:#ff7b7b;
}

.cardBody{
  padding:16px;
}

.customer{
  font-size:16px;
  font-weight:800;
  margin-bottom:12px;
}

.items{
  white-space:pre-wrap;
  font-size:19px;
  line-height:1.65;
  min-height:110px;
}

.note{
  margin-top:14px;
  background:#0f1318;
  border:1px solid #252c35;
  padding:10px 12px;
  border-radius:10px;
  color:#d7dce3;
}

.times{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  font-size:13px;
  color:var(--muted);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  padding:14px 16px;
  border-top:1px solid var(--line);
  background:#12171c;
}

.btn-accept{
  background:var(--yellow);
  color:#1a1304;
  padding:13px;
}

.btn-done{
  background:var(--green);
  color:#07170d;
  padding:13px;
}

.btn-delete{
  background:var(--red);
  color:white;
  padding:13px;
}

.btn-secondary{
  background:#2a313a;
  color:white;
  padding:13px;
}

.btn-edit{
  background:#5b7cfa;
  color:white;
  padding:13px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:90px 20px;
  color:var(--muted);
  font-size:18px;
}

.modalWrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}

.modalWrap.open{
  display:flex;
}

.modal{
  width:min(560px,100%);
  background:#151a20;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}

.detailModal{
  width:min(900px,100%);
}

.detailItems{
  white-space:pre-wrap;
  font-size:clamp(24px,4vw,42px);
  line-height:1.45;
  font-weight:800;
  padding:18px 0;
}

.detailCustomer,
.detailNote{
  font-size:20px;
  line-height:1.5;
}

.detailNote{
  margin-top:16px;
  color:#ffd677;
}

label{
  display:block;
  font-size:13px;
  color:#cfd5dd;
  margin:9px 0 6px;
}

input,textarea{
  width:100%;
  background:#0d1116;
  color:#fff;
  border:1px solid #2c3440;
  border-radius:10px;
  padding:12px;
  font:inherit;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.modalActions{
  display:flex;
  gap:9px;
  margin-top:14px;
}

.modalActions button{
  flex:1;
  padding:12px;
}

@media(max-width:620px){
  header{
    height:68px;
    padding:0 14px;
  }

  h1{
    font-size:22px;
  }

  .clock{
    font-size:16px;
  }

  main{
    padding:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">ST</div>
    <div>
      <h1>Sweet Tic Tac</h1>
      <div class="sub">Kitchen Orders</div>
    </div>
  </div>

  <div class="clock" id="clock"></div>
</header>

<main>

  <div class="topbar">

    <div class="stats">
      <div class="stat">חדשות: <strong id="newCount">0</strong></div>
      <div class="stat">בטיפול: <strong id="workCount">0</strong></div>
      <div class="stat">הושלמו: <strong id="doneCount">0</strong></div>
    </div>

    <div class="syncTools">
      <span class="syncStatus" id="syncStatus">מתחבר...</span>
      <button class="notify" onclick="configureServer()">כתובת שרת</button>
      <button class="notify" id="notifyButton" onclick="enableNotifications()">🔔 הפעל התראות</button>
      <button class="clearDone" id="clearDoneButton" onclick="clearDoneOrders()">מחק טופלו</button>
      <button class="add" onclick="openModal()">+ הוספת הזמנה</button>
    </div>

  </div>

  <section class="grid" id="orders"></section>

</main>

<div class="modalWrap" id="modalWrap">

  <div class="modal">

    <h2 id="orderModalTitle">הזמנה חדשה</h2>

    <label>שם לקוח</label>
    <input id="customer" placeholder="שם לקוח" />

    <label>מספר הזמנה</label>
    <input id="orderNo" placeholder="נוצר אוטומטית" />

    <label>פריטי הזמנה</label>
    <textarea id="items" placeholder="לדוגמה:
2 × קרפ נוטלה
1 × וופל בלגי
1 × אייס קפה"></textarea>

    <label>הערות</label>
    <textarea id="notes" placeholder="הערה למטבח / לקחת / אלרגיה"></textarea>

    <div class="modalActions">
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn-done" id="orderSubmitButton" onclick="addOrder()">שלח למטבח</button>
    </div>

  </div>

</div>

<div class="modalWrap" id="detailModalWrap" onclick="closeDetail(event)">
  <div class="modal detailModal" onclick="event.stopPropagation()">
    <h2 id="detailTitle"></h2>
    <div class="detailCustomer" id="detailCustomer"></div>
    <div class="detailItems" id="detailItems"></div>
    <div class="detailNote" id="detailNote"></div>
    <div class="modalActions">
      <button class="btn-secondary" onclick="closeDetail()">סגור</button>
    </div>
  </div>
</div>

<script>

const ordersKey = 'stt_kitchen_orders';
const serverKey = 'stt_server_url';

function sanitizeOrders(list){
  if(!Array.isArray(list)) return [];
  return list.filter(order => {
    if(!order || typeof order !== 'object') return false;
    const isDemo = String(order.id).trim() === 'v1'
      || String(order.customer || '').trim().toLowerCase() === 'test'
      || Number(order.no) === 1001;
    return !isDemo && (order.id !== undefined || order.no !== undefined);
  });
}

function clearPersistentDemoState(){
  try{
    const raw = JSON.parse(localStorage.getItem(ordersKey) || '[]');
    const cleaned = sanitizeOrders(raw);
    if(cleaned.length !== (Array.isArray(raw) ? raw.length : 0)){
      localStorage.setItem(ordersKey, JSON.stringify(cleaned));
    }
  }catch(e){}
}

let orders = [];
try{
  orders = sanitizeOrders(JSON.parse(localStorage.getItem(ordersKey) || '[]'));
}catch(e){
  orders = [];
}
clearPersistentDemoState();
localStorage.setItem(ordersKey, JSON.stringify(orders));
let editingOrderId = null;
let eventSource;
let knownOrderIds = new Set(orders.map(o => o.id));
let retryTimer;
let pollTimer;
let audioEnabled = false;
let alarmContext;
let alarmTimer;
const ringingOrders = new Set();

function normalizeOrders(list){
  return Array.isArray(list) ? list.filter(Boolean) : [];
}

function serverBase(){
  const configured = localStorage.getItem(serverKey);
  if(configured) return configured.replace(/\/$/, '');
  if(window.location.protocol === 'http:' || window.location.protocol === 'https:'){
    return window.location.origin;
  }
  return 'http://localhost:3000';
}

function configureServer(){
  const value = prompt('כתובת השרת, לדוגמה: http://192.168.1.20:3000', serverBase());
  if(!value) return;
  localStorage.setItem(serverKey, value.trim().replace(/\/$/, ''));
  if(eventSource) eventSource.close();
  syncOrders();
}

function updateTitle(hasUpdates){
  document.title = hasUpdates ? '(חדש) Sweet Tic Tac | Kitchen' : 'Sweet Tic Tac | Kitchen';
}

function setSyncStatus(text, online){
  const status = document.getElementById('syncStatus');
  status.textContent = text;
  status.style.color = online ? 'var(--green)' : 'var(--yellow)';
}

function applyOrders(nextOrders, notify = false){
  if(!Array.isArray(nextOrders)){
    return;
  }

  const safeOrders = sanitizeOrders(nextOrders);

  if(safeOrders.length === 0 && orders.length > 0){
    localStorage.setItem(ordersKey, JSON.stringify(orders));
    render();
    return;
  }

  const added = safeOrders.filter(o => !knownOrderIds.has(o.id) && o.status === 'new');
  orders = safeOrders;
  knownOrderIds = new Set(orders.map(o => o.id));
  for(const id of [...ringingOrders]){
    const order = orders.find(item => item.id === id);
    if(!order || order.status !== 'new') stopAlarm(id);
  }
  localStorage.setItem(ordersKey, JSON.stringify(orders));
  render();

  if(notify && added.length && audioEnabled){
    startAlarm(added.map(order => order.id));
    updateTitle(true);
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('הזמנה חדשה', {
        body: `הזמנה #${added[0].no} נכנסה למטבח`,
        tag: `order-${added[0].id}`
      });
    }
  }
}

async function syncOrders(){
  try{
    const response = await fetch(`${serverBase()}/api/orders`);
    if(!response.ok) throw new Error('sync failed');
    applyOrders(await response.json());
    setSyncStatus('מסונכרן', true);
    connectEvents();
    clearTimeout(retryTimer);
  }catch(e){
    setSyncStatus('אין חיבור לשרת', false);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(syncOrders, 3000);
  }
}

function connectEvents(){
  const base = serverBase();
  const isPublicHost = /vercel\.app|vercel\.dev|netlify\.app|render\.com|firebaseapp\.com/i.test(base);

  if(isPublicHost){
    clearInterval(pollTimer);
    pollTimer = setInterval(() => syncOrders(), 5000);
    setSyncStatus('מסונכרן', true);
    return;
  }

  if(eventSource) eventSource.close();
  eventSource = new EventSource(`${base}/events`);
  eventSource.onopen = () => setSyncStatus('מסונכרן', true);
  eventSource.onmessage = event => applyOrders(JSON.parse(event.data), true);
  eventSource.onerror = () => {
    setSyncStatus('מנסה להתחבר...', false);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(syncOrders, 3000);
  };
}

async function pushOrders(){
  localStorage.setItem(ordersKey, JSON.stringify(orders));
  try{
    const response = await fetch(`${serverBase()}/api/orders`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(orders)
    });
    if(!response.ok) throw new Error('sync failed');
    setSyncStatus('מסונכרן', true);
  }catch(e){
    setSyncStatus('לא נשמר בשרת', false);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(syncOrders, 3000);
  }
}

async function enableNotifications(){
  unlockAudio();
  if(!('Notification' in window)) return;
  const permission = await Notification.requestPermission();
  const button = document.getElementById('notifyButton');
  button.textContent = permission === 'granted' ? '🔔 התראות פעילות' : '🔕 התראות חסומות';
}

function save(){
  localStorage.setItem(
    'stt_kitchen_orders',
    JSON.stringify(orders)
  );
}

function pad(n){
  return String(n).padStart(2,'0');
}

function formatTime(d = new Date()){
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function nextOrderNo(){

  const n = Number(
    localStorage.getItem('stt_next_order') || '1001'
  );

  localStorage.setItem(
    'stt_next_order',
    String(n + 1)
  );

  return n;
}

function esc(s=''){

  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));

}

function openModal(){
  editingOrderId = null;
  document.getElementById('orderModalTitle').textContent = 'הזמנה חדשה';
  document.getElementById('orderSubmitButton').textContent = 'שלח למטבח';
  document.getElementById('customer').value = '';
  document.getElementById('orderNo').value = '';
  document.getElementById('items').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('modalWrap').classList.add('open');
}

function closeModal(){
  document.getElementById('modalWrap').classList.remove('open');
}

function openEditOrder(id){
  const order = orders.find(item => item.id === id);
  if(!order) return;

  editingOrderId = id;
  document.getElementById('orderModalTitle').textContent = `עריכת הזמנה #${order.no}`;
  document.getElementById('customer').value = order.customer;
  document.getElementById('orderNo').value = order.no;
  document.getElementById('items').value = order.items;
  document.getElementById('notes').value = order.notes;
  document.getElementById('orderSubmitButton').textContent = 'שמור שינויים';
  document.getElementById('modalWrap').classList.add('open');
}

function openOrder(id){
  const order = orders.find(item => item.id === id);
  if(!order) return;

  document.getElementById('detailTitle').textContent = `הזמנה #${order.no}`;
  document.getElementById('detailCustomer').textContent = `לקוח: ${order.customer}`;
  document.getElementById('detailItems').textContent = order.items;
  document.getElementById('detailNote').textContent = order.notes ? `הערה: ${order.notes}` : '';
  document.getElementById('detailModalWrap').classList.add('open');
}

function closeDetail(event){
  if(event && event.target !== event.currentTarget) return;
  document.getElementById('detailModalWrap').classList.remove('open');
}

async function addOrder(){

  const items =
  document.getElementById('items').value.trim();

  if(!items){
    alert('יש להכניס פריטי הזמנה');
    return;
  }

  if(editingOrderId !== null){
    orders = orders.map(order =>
      order.id === editingOrderId
      ? {
          ...order,
          no: document.getElementById('orderNo').value.trim() || order.no,
          customer: document.getElementById('customer').value.trim() || 'לקוח',
          items,
          notes: document.getElementById('notes').value.trim(),
          createdAt: order.createdAt || Date.now()
        }
      : order
    );

    await pushOrders();
    render();
    closeModal();
    return;
  }

  const order = {

    id: Date.now(),

    no:
    document.getElementById('orderNo').value.trim()
    || nextOrderNo(),

    customer:
    document.getElementById('customer').value.trim()
    || 'לקוח',

    items: items,

    notes:
    document.getElementById('notes').value.trim(),

    createdAt: Date.now(),

    createdTime: formatTime(),

    doneTime: null,

    status:'new'
  };

  orders.unshift(order);

  await pushOrders();

  render();

  if(audioEnabled) startAlarm([order.id]);

  document.getElementById('customer').value='';
  document.getElementById('orderNo').value='';
  document.getElementById('items').value='';
  document.getElementById('notes').value='';

  closeModal();
}

function acceptOrder(id){
  stopAlarm(id);

  orders = orders.map(order =>
    order.id === id
      ? { ...order, status: 'work', doneAt: null, doneTime: null }
      : order
  );

  pushOrders();
  render();
}

function doneOrder(id){
  stopAlarm(id);

  orders = orders.map(order =>
    order.id === id
      ? { ...order, status: 'done', doneTime: order.doneTime || formatTime(), doneAt: order.doneAt || Date.now() }
      : order
  );

  pushOrders();
  render();
}

function deleteOrder(id){

  if(!confirm('להסיר את ההזמנה מהמסך?'))
    return;

  orders = orders.filter(o => o.id !== id);
  localStorage.setItem(ordersKey, JSON.stringify(orders));
  render();
  pushOrders();
}

function clearDoneOrders(){
  const doneCount = orders.filter(o => o.status === 'done').length;

  if(!doneCount){
    return;
  }

  if(!confirm(`למחוק ${doneCount} הזמנות שסומנו כטופלו?`)){
    return;
  }

  orders = orders.filter(o => o.status !== 'done');
  pushOrders();
  render();
}

function elapsed(createdAt, endAt = Date.now()){
  const safeCreatedAt = Number(createdAt) || Date.now();
  const safeEndAt = Number(endAt) || Date.now();
  const diff = Math.max(0, safeEndAt - safeCreatedAt);
  const m = Math.floor(diff / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return `${pad(m)}:${pad(s)}`;
}

function render(){

  document.getElementById('newCount').textContent =
  orders.filter(o => o.status === 'new').length;

  document.getElementById('workCount').textContent =
  orders.filter(o => o.status === 'work').length;

  document.getElementById('doneCount').textContent =
  orders.filter(o => o.status === 'done').length;

  document.getElementById('clearDoneButton').disabled =
  !orders.some(o => o.status === 'done');

  const root =
  document.getElementById('orders');

  if(!orders.length){

    root.innerHTML =
    '<div class="empty">אין כרגע הזמנות פעילות</div>';

    return;
  }

  root.innerHTML =
  orders.map(o => {
    const createdAt = Number(o.createdAt) || Date.now();
    const status =
    o.status === 'new'

    ? '<span class="status s-new">חדש</span>'

    : o.status === 'work'

    ? '<span class="status s-work">בטיפול</span>'

    : '<span class="status s-done">טופל</span>';

    const late =
    (Date.now() - createdAt) > 10 * 60 * 1000
    ? 'late'
    : '';

    return `

    <article class="card ${o.status==='new'?'new':''} ${o.status==='done'?'done':''}" onclick="openOrder(${o.id})">

      <div class="cardTop">

        <div>

          <div class="timer ${late}">
            ⏱ ${elapsed(o.createdAt, o.status === 'done' ? o.doneAt || o.createdAt : Date.now())}
          </div>

          <div class="num">
            הזמנה #${esc(o.no)}
          </div>

        </div>

        ${status}

      </div>

      <div class="cardBody">

        <div class="customer">
          ${esc(o.customer)}
        </div>

        <div class="items">
          ${esc(o.items)}
        </div>

        ${
          o.notes
          ? `<div class="note">
              הערה: ${esc(o.notes)}
             </div>`
          : ''
        }

        <div class="times">

          <div>
            נכנסה: ${esc(o.createdTime)}
          </div>

          <div>
            טופל: ${o.doneTime || '—'}
          </div>

        </div>

      </div>

      <div class="actions" onclick="event.stopPropagation()">

        ${
          o.status === 'new'
          ? `<button
              class="btn-accept"
              onclick="acceptOrder(${o.id})">
              אישור
             </button>`
          : ''
        }

        ${
          o.status !== 'done'
          ? `<button
              class="btn-done"
              onclick="doneOrder(${o.id})">
              טופל
             </button>`
          : ''
        }

        ${
          o.status === 'done'
          ? `<button
              class="btn-secondary"
              onclick="acceptOrder(${o.id})">
              החזר לטיפול
             </button>`
          : ''
        }

        <button
          class="btn-edit"
          onclick="openEditOrder(${o.id})">
          ערוך
        </button>

        <button
          class="btn-delete"
          onclick="deleteOrder(${o.id})">
          הסר
        </button>

      </div>

    </article>

    `;

  }).join('');
}

function startAlarm(ids){
  if(!audioEnabled) return;
  ids.forEach(id => ringingOrders.add(id));
  if(alarmTimer) return;

  try{
    alarmContext ||= new (window.AudioContext || window.webkitAudioContext)();
    alarmContext.resume();
    playAlarmBurst();
    alarmTimer = setInterval(playAlarmBurst, 1400);
  }catch(e){}
}

function unlockAudio(){
  audioEnabled = true;
  try{
    if(!alarmContext) alarmContext = new (window.AudioContext || window.webkitAudioContext)();
    if(alarmContext.state === 'suspended') alarmContext.resume();
  }catch(e){}
}

function playAlarmBurst(){
  if(!ringingOrders.size){
    stopAlarm();
    return;
  }

  try{
    const frequencies = [760, 1040, 760, 1040];
    frequencies.forEach((frequency, index) => {
      const oscillator = alarmContext.createOscillator();
      const gain = alarmContext.createGain();
      const start = alarmContext.currentTime + index * .16;
      oscillator.type = 'square';
      oscillator.frequency.value = frequency;
      oscillator.connect(gain);
      gain.connect(alarmContext.destination);
      gain.gain.setValueAtTime(.001, start);
      gain.gain.exponentialRampToValueAtTime(.42, start + .025);
      gain.gain.exponentialRampToValueAtTime(.001, start + .13);
      oscillator.start(start);
      oscillator.stop(start + .14);
    });
  }catch(e){}
}

function stopAlarm(id){
  if(id !== undefined) ringingOrders.delete(id);
  if(ringingOrders.size || !alarmTimer) return;
  clearInterval(alarmTimer);
  alarmTimer = null;
}

document.addEventListener('pointerdown', unlockAudio, {once:true});

if('Notification' in window && Notification.permission === 'granted'){
  document.getElementById('notifyButton').textContent = '🔔 התראות פעילות';
}

document.addEventListener('visibilitychange', () => {
  if(!document.hidden) updateTitle(false);
});

function tick(){

  const clock = document.getElementById('clock');
  if(clock){
    clock.textContent = new Date().toLocaleTimeString(
      'he-IL',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      }
    );
  }

  render();
}

setInterval(tick,1000);

tick();

window.addEventListener('storage',e=>{

  if(e.key === 'stt_kitchen_orders'){

    applyOrders(JSON.parse(e.newValue || '[]'), true);

  }

});

syncOrders();

</script>
